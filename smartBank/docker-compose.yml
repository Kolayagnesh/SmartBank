version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smartbank-db
    restart: always
    environment:
      MYSQL_DATABASE: smartbank
      MYSQL_ROOT_PASSWORD: root_password123
      MYSQL_USER: smartbank_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartbank-network

  backend:
    build: ./backend
    container_name: smartbank-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/smartbank?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=smartbank_user
      - SPRING_DATASOURCE_PASSWORD=password123
    depends_on:
      - db
    networks:
      - smartbank-network

  frontend:
    build: ./frontend
    container_name: smartbank-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartbank-network

volumes:
  mysql_data:

networks:
  smartbank-network:
    driver: bridge